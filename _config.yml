title: "Extreme Data Curation 2026"
slogan: "First Annual Workshop on Curation and Contextualization of Extreme Datasets"

# Feeling Responsive theme via remote_theme (GitHub Pages deployment)
# NOTE: local preview requires SSL to be working — see _config_local.yml
remote_theme: Phlow/feeling-responsive

# GitHub repo
repository: ExtremeDataCurationWorkshop/ExtremeDataCurationWorkshop.github.io

#url: "https://extremedatacurationworkshop.github.io"
#baseurl: ""

# Main author — details in _data/authors.yml
author: organizers

# Footer credits
credits: >-
  <p>Extreme Curation 2026 &mdash; Co-located with
  <a href="https://bigdataieee.org/BigData2026/">IEEE BigData 2026</a>.<br/>Contact: <a href="mailto:extreme-data-curation-organizers@googlegroups.com">extreme-data-curation-organizers@googlegroups.com</a><br/><a href="https://commons.wikimedia.org/w/index.php?curid=6359233">Banner photo</a> credit: <a href="https://en.wikipedia.org/wiki/User:Hngrange">Hngrange</a> at <a href="https://en.wikipedia.org/wiki/">English Wikipedia</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/deed.en">CC BY-SA 3.0</a>) </p>

# Transparent 1×1 placeholder — suppresses the broken image the theme
# renders when no logo is set (it always emits an <img> tag regardless)
logo: "logo.png"

# Base URL for images — theme prepends this to image_fullwidth filenames
urlimg: '/assets/img/'

# Markdown
markdown: kramdown
highlighter: rouge
permalink: /:title/
excerpt_separator: "<!--more-->"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - _config_local.yml
  - "\\#*\\#"
  - ".\\#*"

# Sass
sass:
  sass_dir: _sass
  style: :compressed

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      show_meta: false
      comments: false
      author: organizers
