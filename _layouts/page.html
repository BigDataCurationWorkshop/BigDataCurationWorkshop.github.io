---
layout: default
---
<div class="row t30">
  <div class="medium-10 columns medium-offset-1 end">
    <article itemscope itemtype="http://schema.org/Article">
      <header>
        {% if page.title %}
          <div itemprop="name">
            <h1>{{ page.title }}</h1>
          </div>
        {% endif %}
      </header>
      <div itemprop="articleSection">
        {{ content }}
      </div>
    </article>
  </div><!-- /.medium-10.columns -->
</div><!-- /.row -->
